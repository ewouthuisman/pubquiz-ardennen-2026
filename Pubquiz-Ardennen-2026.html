<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>De grote mannenweekend pubquiz — Ardennen editie</title>
<style>
/* ==================================================================
   STIJL — hier hoef je niks aan te doen, tenzij je kleuren wil wijzigen
   ================================================================== */
:root{
  --bg:#0a0f0d;
  --bg2:#111a16;
  --ink:#f3ece0;
  --muted:#9db3a6;
  --gold:#d9a441;
  --gold2:#f2c568;
  --line:rgba(217,164,65,.25);
  --accent:#d9a441;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Segoe UI",-apple-system,Roboto,Helvetica,Arial,sans-serif;
  overflow:hidden;
}
#stage{
  position:fixed;inset:0;
  display:flex;align-items:center;justify-content:center;
  padding:4.5vh 5vw 8vh;
}
.slide{width:100%;max-width:1500px;max-height:100%;animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* achtergrond sfeer */
#bgfx{position:fixed;inset:0;z-index:-2;background:
  radial-gradient(1100px 700px at 15% -10%, rgba(217,164,65,.13), transparent 60%),
  radial-gradient(900px 600px at 100% 100%, rgba(70,120,95,.20), transparent 60%),
  linear-gradient(160deg,#0a0f0d 0%,#101a15 55%,#0a0f0d 100%);}
#bgfx.round{background:
  radial-gradient(1200px 800px at 50% -20%, color-mix(in srgb, var(--accent) 30%, transparent), transparent 65%),
  linear-gradient(160deg,#0a0f0d 0%,#111a16 60%,#080c0a 100%);}
#trees{position:fixed;left:0;right:0;bottom:0;height:16vh;z-index:-1;opacity:.5;pointer-events:none}

/* HUD */
#hud{position:fixed;left:0;right:0;bottom:0;height:46px;display:flex;align-items:center;
  gap:16px;padding:0 22px;font-size:13px;color:var(--muted);
  background:linear-gradient(to top,rgba(0,0,0,.6),transparent);z-index:50;letter-spacing:.06em}
#hud b{color:var(--gold);font-weight:600}
#bar{position:fixed;left:0;bottom:0;height:3px;background:var(--gold);z-index:60;transition:width .3s}
.kbd{border:1px solid rgba(255,255,255,.18);border-radius:4px;padding:1px 6px;font-size:11px}
#hudright{margin-left:auto;display:flex;gap:14px;align-items:center}

/* grote timer-cirkel bovenaan */
#timerring{position:fixed;top:20px;left:50%;z-index:80;width:128px;height:128px;
  opacity:0;pointer-events:none;transform:translate(-50%,-14px) scale(.88);
  transition:opacity .25s ease,transform .25s ease}
#timerring.on{opacity:1;transform:translate(-50%,0) scale(1)}
#timerring svg{width:100%;height:100%;transform:rotate(-90deg);filter:drop-shadow(0 6px 18px rgba(0,0,0,.45))}
#timerring .ring-bg{fill:rgba(10,15,13,.92);stroke:rgba(217,164,65,.22);stroke-width:8}
#timerring .ring-fg{fill:none;stroke:var(--gold);stroke-width:8;stroke-linecap:round;
  stroke-dasharray:326.726;stroke-dashoffset:0;
  transition:stroke-dashoffset 1s linear,stroke .3s ease;
  filter:drop-shadow(0 0 8px rgba(217,164,65,.55))}
#ringnum{position:absolute;inset:0;display:grid;place-items:center;
  font-family:Georgia,serif;font-weight:800;font-size:38px;color:var(--ink);letter-spacing:-.02em}
#timerring.time-up{animation:ringpulse .6s ease infinite}
#timerring.time-up .ring-fg{stroke:#ff5a4a;filter:drop-shadow(0 0 10px rgba(255,90,74,.7))}
#timerring.time-up #ringnum{color:#ff8a7a}
@keyframes ringpulse{0%,100%{transform:translate(-50%,0) scale(1)}50%{transform:translate(-50%,0) scale(1.07)}}

/* typografie */
.eyebrow{font-size:clamp(11px,1.1vw,15px);letter-spacing:.32em;text-transform:uppercase;color:var(--accent);font-weight:700}
h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(38px,6.6vw,104px);line-height:.98;font-weight:700;letter-spacing:-.02em}
h2{font-family:Georgia,serif;font-size:clamp(30px,4.6vw,72px);line-height:1.03;font-weight:700}
.qtext{font-family:Georgia,serif;font-size:clamp(26px,3.5vw,58px);line-height:1.16;font-weight:700;letter-spacing:-.01em}
.sub{font-size:clamp(15px,1.5vw,24px);color:var(--muted);line-height:1.5}
.gold{color:var(--gold)}
.rule{height:1px;background:linear-gradient(to right,var(--accent),transparent);margin:22px 0}

/* titelslide */
.hero{text-align:center}
.hero .crest{font-size:clamp(40px,5vw,74px);margin-bottom:10px}
.hero .meta{margin-top:34px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:9px 20px;font-size:clamp(12px,1.2vw,17px);
  color:var(--ink);background:rgba(217,164,65,.07)}

/* rondekop */
.roundwrap{text-align:center}
.bignum{font-family:Georgia,serif;font-size:clamp(90px,17vw,260px);line-height:.8;
  color:transparent;-webkit-text-stroke:2px var(--accent);opacity:.8}
.roundwrap h2{margin-top:10px}
.roundwrap .sub{max-width:820px;margin:22px auto 0}
.tags{margin-top:30px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

/* vraagslide */
.qhead{display:flex;align-items:center;gap:14px;margin-bottom:26px}
.qnum{width:clamp(46px,4.4vw,70px);height:clamp(46px,4.4vw,70px);flex:none;border-radius:50%;
  display:grid;place-items:center;background:var(--accent);color:#0a0f0d;
  font-weight:800;font-size:clamp(19px,2vw,30px);font-family:Georgia,serif}
.qmeta{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}
.hint{margin-top:26px;font-size:clamp(14px,1.4vw,21px);color:var(--muted);font-style:italic}
.opts{margin-top:30px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opt{border:1px solid var(--line);border-radius:12px;padding:16px 20px;font-size:clamp(15px,1.6vw,25px);
  background:rgba(255,255,255,.03)}
.opt span{color:var(--accent);font-weight:800;margin-right:10px}
.peek{margin-top:26px;border-left:3px solid var(--gold);padding:12px 18px;background:rgba(217,164,65,.10);
  border-radius:0 10px 10px 0;font-size:clamp(15px,1.7vw,26px);display:none}
.peek.on{display:block}
.peek b{color:var(--gold2)}

/* media */
.mediabox{position:relative;margin-top:22px;border-radius:16px;overflow:hidden;
  border:1px solid var(--line);background:#000;aspect-ratio:16/9;max-height:52vh;margin-inline:auto;width:100%;max-width:960px}
.localvideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.mediabox audio{display:none}
.beeptag{position:absolute;top:12px;right:12px;z-index:5;background:rgba(217,60,60,.85);color:#fff;
  border-radius:8px;padding:5px 12px;font-size:12px;letter-spacing:.14em;font-weight:700;display:none}
.beeptag.on{display:block}
.mediaerr{position:absolute;inset:0;z-index:7;display:none;place-items:center;text-align:center;
  padding:24px;background:rgba(5,5,5,.92);color:#ffb4a2;font-size:clamp(14px,1.6vw,20px);line-height:1.5}
.mediaerr.on{display:grid}
.mediaerr small{display:block;margin-top:10px;font-size:.7em;opacity:.8;color:var(--muted)}
.imagebox{position:relative;margin-top:22px;border-radius:16px;overflow:hidden;
  border:1px solid var(--line);background:#000;aspect-ratio:16/9;max-height:52vh;margin-inline:auto;width:100%;max-width:960px}
.imagebox img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#070b09;display:block}
.imagepair{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px auto 0;width:100%;max-width:960px}
.imagepair .imagebox{margin:0;max-width:none;aspect-ratio:1/1;max-height:42vh}
@media (max-width:600px){.imagepair{grid-template-columns:1fr}.imagepair .imagebox{max-height:30vh}}
.questionimage{aspect-ratio:16/5;max-height:24vh;margin-top:14px}
.questionimage img{object-fit:cover}
.bpm-image{aspect-ratio:16/9;max-height:52vh;margin-top:22px}
.bpm-image img{object-fit:contain}
.bpm-stage{isolation:isolate}
.bpm-stage .bpm-floater{position:absolute;z-index:2;width:clamp(76px,11vw,150px);height:clamp(76px,11vw,150px);
  object-fit:contain;border:2px solid var(--gold);border-radius:12px;background:rgba(7,11,9,.72);
  box-shadow:0 8px 24px rgba(0,0,0,.5);pointer-events:none;animation:bpm-cross var(--bpm-duration,14s) linear infinite alternate;
  animation-delay:var(--bpm-delay,0s)}
@keyframes bpm-cross{
  0%{left:var(--bpm-x-start);top:var(--bpm-y-start);transform:rotate(var(--bpm-rotate-start)) scale(.86)}
  48%{left:var(--bpm-x-mid);top:var(--bpm-y-mid);transform:rotate(var(--bpm-rotate-mid)) scale(1)}
  100%{left:var(--bpm-x-end);top:var(--bpm-y-end);transform:rotate(var(--bpm-rotate-end)) scale(.9)}
}
.bpm-player{position:relative;margin:12px auto 0;text-align:center;min-height:58px}
.bpm-player audio{display:none}
.bpm-player .playbtn{padding:8px 18px;font-size:13px}
.bpm-player .timerpill{display:inline-block;margin:0 0 0 10px;font-size:12px;letter-spacing:.12em}
.bpm-player .mediaerr{position:relative;inset:auto;margin:10px auto 0;max-width:520px;border-radius:8px}
.cover{position:absolute;inset:0;display:grid;place-items:center;text-align:center;
  background:radial-gradient(circle at 50% 40%,#1b2620,#080b09);z-index:3}
.vinyl{width:min(210px,26vh);height:min(210px,26vh);border-radius:50%;margin:0 auto 18px;
  background:repeating-radial-gradient(circle at 50% 50%,#151b18 0 3px,#0d1210 3px 6px);
  border:1px solid rgba(255,255,255,.1);display:grid;place-items:center;animation:spin 6s linear infinite}
.vinyl.paused{animation-play-state:paused}
.vinyl::after{content:"";width:28%;height:28%;border-radius:50%;background:var(--accent)}
@keyframes spin{to{transform:rotate(360deg)}}
.playbtn{cursor:pointer;border:1px solid var(--gold);color:var(--gold);background:rgba(217,164,65,.12);
  border-radius:999px;padding:13px 30px;font-size:clamp(14px,1.5vw,20px);font-weight:700;letter-spacing:.08em}
.playbtn:hover{background:var(--gold);color:#0a0f0d}
.timerpill{margin-top:14px;font-size:14px;color:var(--muted);letter-spacing:.2em}
.missing{color:#ffb4a2;font-size:14px;margin-top:12px;max-width:520px;line-height:1.5}
.svlink{display:inline-block;margin-top:14px;font-size:13px;color:var(--muted);text-decoration:none;
  border-bottom:1px dotted var(--muted)}

/* songtekst naast het fragment */
.media-lyrics-row{display:flex;gap:16px;align-items:stretch;margin-top:22px;
  max-width:1200px;margin-inline:auto}
.media-lyrics-row .mediabox{margin-top:0;margin-inline:0;flex:1 1 0;max-width:none;min-width:0}
.lyrics-panel{flex:0 0 clamp(200px,24vw,300px);max-width:300px;background:#0d1310;
  border:1px solid var(--line);border-radius:16px;padding:14px 18px;
  max-height:52vh;display:flex;flex-direction:column}
.lyrics-head{flex:0 0 auto;font-size:12px;letter-spacing:.28em;text-transform:uppercase;
  color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:10px}
.lyrics-scroll{flex:1 1 auto;overflow:hidden;position:relative}
.lyrics-text{color:var(--gold2);font-size:clamp(12px,1.15vw,16px);line-height:1.6;
  white-space:pre-wrap;will-change:transform}

/* streetview */
.svbox{position:relative;margin-top:18px;border-radius:16px;overflow:hidden;border:1px solid var(--line);
  aspect-ratio:16/9;max-height:56vh;width:100%;max-width:1120px;margin-inline:auto;background:#000}
.svbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.svtag{position:absolute;top:12px;left:12px;z-index:5;background:rgba(0,0,0,.7);border:1px solid var(--line);
  border-radius:8px;padding:6px 12px;font-size:12px;letter-spacing:.2em;color:var(--gold)}

/* nakijksheet */
.sheet{display:grid;grid-template-columns:1fr 1fr;gap:26px 40px}
.sheetcol h3{font-family:Georgia,serif;font-size:clamp(19px,2vw,30px);color:var(--gold);margin-bottom:12px;
  padding-bottom:8px;border-bottom:1px solid var(--line)}
.ans{display:flex;gap:12px;padding:7px 0;font-size:clamp(13px,1.32vw,20px);line-height:1.35;
  border-bottom:1px dashed rgba(255,255,255,.07)}
.ans i{color:var(--accent);font-style:normal;font-weight:800;flex:none;width:1.5em}
.ans em{color:var(--muted);font-style:normal;font-size:.85em;display:block}
.sheethead{display:flex;align-items:flex-end;gap:18px;margin-bottom:20px}

/* tabel eindstand */
table.score{width:100%;border-collapse:collapse;margin-top:26px;font-size:clamp(14px,1.5vw,23px)}
table.score th,table.score td{border-bottom:1px solid var(--line);padding:13px 12px;text-align:left}
table.score th{color:var(--accent);font-size:12px;letter-spacing:.2em;text-transform:uppercase}
table.score td:first-child{width:60px;color:var(--muted);font-family:Georgia,serif;font-size:1.3em}

.center{text-align:center}
.two{display:grid;grid-template-columns:1.15fr .85fr;gap:44px;align-items:center}
@media (max-width:900px){.two,.opts,.sheet{grid-template-columns:1fr}}
.list{margin-top:20px}
.list div{padding:9px 0;border-bottom:1px dashed rgba(255,255,255,.08);font-size:clamp(14px,1.5vw,22px);display:flex;gap:12px}
.list div span{color:var(--accent);font-weight:800}
#toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);
  border:1px solid var(--line);color:var(--gold);padding:9px 18px;border-radius:999px;font-size:13px;
  letter-spacing:.14em;z-index:99;opacity:0;transition:opacity .25s}
#toast.on{opacity:1}
#overview{position:fixed;inset:0;background:rgba(5,8,7,.97);z-index:80;display:none;padding:5vh 5vw;overflow:auto}
#overview.on{display:block}
#overview .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:22px}
#overview button{text-align:left;background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--ink);
  border-radius:10px;padding:11px 13px;font-size:13px;cursor:pointer;font-family:inherit}
#overview button:hover{border-color:var(--gold);background:rgba(217,164,65,.12)}
#overview button small{display:block;color:var(--muted);margin-top:3px}
</style>
</head>

<div id="bgfx"></div>
<svg id="trees" viewBox="0 0 1200 200" preserveAspectRatio="none" aria-hidden="true">
  <path fill="#050807" d="M0 200V150l30-42 16 22 22-34 20 28 26-44 24 36 18-24 28 40 22-30 26 38 20-26 30 44 24-34 22 30 26-42 24 38 20-26 28 40 24-32 22 28 26-40 24 36 20-24 30 42 22-30 26 38 24-34 22 30 26-42 24 38 20-26 28 40 24-32 22 28 26-40 24 36 20-24 30 42 22-30 26 38 24-34 22 30 26-42 24 38 20-26 28 40V200z"/>
</svg>

<div id="stage"></div>
<div id="bar"></div>
<div id="timerring" aria-hidden="true">
  <svg viewBox="0 0 120 120">
    <circle class="ring-bg" cx="60" cy="60" r="52"></circle>
    <circle class="ring-fg" id="ringfg" cx="60" cy="60" r="52"></circle>
  </svg>
  <div id="ringnum"></div>
</div>
<div id="hud">
  <span id="hudleft"></span>
  <span id="hudright">
    <span id="clock"></span>
    <span><span class="kbd">←</span> <span class="kbd">→</span> navigeren</span>
    <span><span class="kbd">A</span> antwoord</span>
    <span><span class="kbd">T</span> timer</span>
    <span><span class="kbd">O</span> overzicht</span>
    <span><span class="kbd">F</span> volledig scherm</span>
  </span>
</div>
<div id="toast"></div>
<div id="overview"><div class="eyebrow">Sprong naar</div><h2>Overzicht</h2><div class="grid" id="ovgrid"></div></div>

<script>
/* ####################################################################
   #                                                                  #
   #   >>>  HIER PAS JE ALLES AAN  <<<                                #
   #                                                                  #
   #   MUZIEK / FILM : vul "file" met het pad naar een lokaal audio-  #
   #                   of videobestand (bv. file:"media/Round 2/     #
   #                   Naam.mp3"). Alles speelt lokaal af, zonder     #
   #                   internet of YouTube. Zet zelf een bestand waar #
   #                   jij de rechten op hebt in de map 'media' naast #
   #                   dit HTML-bestand. 'start' = vanaf welke seconde#
   #                   in het bestand afgespeeld wordt, 'duur' = hoe  #
   #                   lang het fragment loopt.                       #
   #                                                                  #
   #   BEEP (walk-on) : optioneel 'beepStart' en 'beepDur' toevoegen  #
   #                   aan een vraag om een stuk van het fragment weg #
   #                   te piepen (bv. het moment dat de omroeper de   #
   #                   naam van de darter noemt). 'beepStart' = aantal#
   #                   seconden ná het begin van het fragment (dus    #
   #                   ná 'start'), 'beepDur' = lengte van de piep in #
   #                   seconden. Laat weg (of null) voor geen piep.   #
   #                                                                  #
   #   STREET VIEW  : lat / lng / heading. Coördinaten haal je uit     #
   #                  Google Maps: rechtsklik op de kaart → de eerste  #
   #                  regel (bv. 50.3969, 6.2647) → kopiëren.          #
   #                  heading = kijkrichting in graden (0=noord).      #
   #                                                                  #
   #################################################################### */

const QUIZ = {
  titel:      "De grote mannenweekend pubquiz",
  subtitel:   "Ardennen editie",
  locatie:    "Freymannshof · Büllingen",
  datum:      "11 – 13 september 2026",

  spelregels: [
    "Teams van 2. Kies een naam.",
    "Eén punt per goed antwoord, tenzij anders vermeld.",
    "Na elke 2 rondes wisselen we de antwoordbladen en kijken we elkaars werk na.",
    "De quizmaster heeft altijd gelijk. Ook als hij ongelijk heeft.",
  ],

  rondes: [
    /* ============================ RONDE 1 ============================ */
    {
      naam:"De Hoge Venen",
      thema:"De locatieronde",
      kleur:"#5fa87c",
      intro:"We beginnen zachtjes. Aardrijkskunde van de route die we net gereden hebben, en van het lapje België waar we nu zitten.",
      type:"text",
      vragen:[
        {v:"In welke provincie ligt Büllingen?", a:"Liège, Wallonia"},
        {v:"Sinds 1919 hoort Büllingen bij België. Bij wie hoorde het daarvoor?", a:"Koninkrijk Pruisen (Duitsland is fout)"},
        {v:"Niet lang geleden was er een enorme natuurbrand in de Hoge Venen, hoeveel Hectare is afgebrand? (100 ha speling)", a:"3200 hectare"},
        {v:"Wat is het hoogste punt van België, gelegen in de Hoge Venen?", a:"Signal de Botrange — 694 meter"},
        {v:"De Ardennen strekken zich uit over meerdere landen. Noem ze allemaal.", a:"België, Frankrijk, Luxemburg"},
        {v:"Noem de voltallige naam van het racecircuit hier in de buurt.", a:"(Circuit de) Spa-Francorchamps"},
        {v:"[placeholder1]", a:"komt nog"},
        {v:"[placeholder2]", a:"komt nog"}
      ]
    },

    /* ============================ RONDE 2 ============================ */
    {
      naam:"Raad de Walk-on",
      thema:"QF World Darts Championship 2026",
      kleur:"#c96a8b",
      intro:"Acht walk-on tunes van dartsspelers. De omroeper noemt vaak hun naam in het fragment — dat stukje piepen we weg. Wie is de darter?",
      type:"media",
      vragen:[
        {v:"Fragment 1 — welke darter?", a:"Jonny Clayton",
         file:"media/Round 2 - walk ons/Jonny Clayton Walk On - 2026 World Darts Championship QF.mp3", start:0, duur:60, beepStart:26, beepDur:6},
        {v:"Fragment 2 — welke darter?", a:"Ryan Searle",
         file:"media/Round 2 - walk ons/Ryan Searle Walk On - 2026 World Darts Championship QF.mp3", start:0, duur:60, beepStart:21.5, beepDur:7},
        {v:"Fragment 3 — welke darter?", a:"Justin Hood",
         file:"media/Round 2 - walk ons/Justin Hood Walk On - 2026 World Darts Championship QF.mp3", start:0, duur:60, beepStart:19, beepDur:5},
        {v:"Fragment 4 — welke darter?", a:"Luke Littler",
         file:"media/Round 2 - walk ons/Luke Littler WALK ON (Greenlight) - World Darts Championship 2026 Final.mp3", start:0, duur:60, beepStart:41, beepDur:5},
        {v:"Fragment 5 — welke darter?", a:"Krzysztof Ratajski",
         file:"media/Round 2 - walk ons/Krzysztof Ratajski Walk on - World Darts Champioship 2026.mp3", start:0, duur:60, beepStart:25, beepDur:4},
        {v:"Fragment 6 — welke darter?", a:"Luke Humphries",
         file:"media/Round 2 - walk ons/Luke Humphries Walk On - 2026 World Darts Championship R4.mp3", start:0, duur:60, beepStart:32, beepDur:6},
        {v:"Fragment 7 — welke darter?", a:"Gian van Veen",
         file:"media/Round 2 - walk ons/Gian van Veen Walk On - 2026 World Darts Championship R4.mp3", start:0, duur:60, beepStart:17, beepDur:9},
        {v:"Fragment 8 — welke darter?", a:"Gary Anderson",
         file:"media/Round 2 - walk ons/Gary Anderson Walk On - 2026 World Darts Championship QF.mp3", start:0, duur:60, beepStart:37, beepDur:9}
      ]
    },

    /* ============================ RONDE 3 ============================ */
    {
      naam:"Intro songs",
      thema:"TV-programma's & klassiekers",
      kleur:"#4f8fd4",
      intro:"Acht herkenningsmelodieën uit bekende programma's. Van welk programma is dit de intro song?",

/* ####################################################################
   #   VANAF HIER: DE MACHINERIE. Niks aan te passen nodig.           #
   #################################################################### */

const stage  = document.getElementById('stage');
const hudL   = document.getElementById('hudleft');
const bgfx   = document.getElementById('bgfx');
const bar    = document.getElementById('bar');
const toastEl= document.getElementById('toast');
const ringEl = document.getElementById('timerring');
const ringFg = document.getElementById('ringfg');
const ringNum= document.getElementById('ringnum');
const RING_CIRC = 326.726;

/* --- slides opbouwen --- */
const slides = [];
slides.push({kind:'title'});
slides.push({kind:'rules'});
const totalRounds = QUIZ.rondes.length;
const totalQuestions = QUIZ.rondes.reduce((sum, round) => sum + round.vragen.length, 0);

QUIZ.rondes.forEach((r, ri) => {
  slides.push({kind:'round', r, ri});
  r.vragen.forEach((q, qi) => slides.push({kind:'q', r, ri, q, qi}));
  if (ri % 2 === 1) {                     // na elke 2 rondes: nakijken
    const a = QUIZ.rondes[ri-1], b = r;
    slides.push({kind:'swap', ri});
    slides.push({kind:'sheet', a, b, ri});
  }
});
slides.push({kind:'final'});
slides.push({kind:'end'});

let i = 0, peek = false, timerId = null, timeLeft = 0;

/* --- helpers --- */
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;');
function toast(t){ toastEl.textContent = t; toastEl.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(()=>toastEl.classList.remove('on'), 1400); }

function roundLetter(ri){ return 'R' + (ri+1); }

/* --- render --- */
function render(){
  const s = slides[i];
  peek = false;
  stopTimer();
  const accent = s.r ? s.r.kleur : (s.b ? s.b.kleur : '#d9a441');
  document.documentElement.style.setProperty('--accent', accent);
  bgfx.className = (s.kind==='round') ? 'round' : '';
  bar.style.width = ((i)/(slides.length-1)*100) + '%';

  let html = '';
  switch(s.kind){

  case 'title':
    html = '<div class="slide hero">'
      + '<div class="crest">🏆</div>'
      + '<div class="eyebrow">'+esc(QUIZ.datum)+'</div>'
      + '<h1>'+esc(QUIZ.titel)+'</h1>'
      + '<div class="rule" style="width:180px;margin:26px auto;background:linear-gradient(to right,transparent,var(--gold),transparent)"></div>'
      + '<div class="sub">'+esc(QUIZ.subtitel)+'</div>'
      + '<div class="meta"><div class="chip">'+esc(QUIZ.locatie)+'</div>'
      + '<div class="chip">'+totalRounds+' rondes · '+totalQuestions+' vragen</div></div></div>';
    break;

  case 'rules':
    html = '<div class="slide"><div class="eyebrow">Voordat we beginnen</div>'
      + '<h2>Spelregels</h2><div class="rule"></div><div class="list">'
      + QUIZ.spelregels.map((t,n)=>'<div><span>'+(n+1)+'</span>'+esc(t)+'</div>').join('')
      + '</div></div>';
    break;

  case 'round':
    html = '<div class="slide roundwrap">'
      + '<div class="bignum">'+(s.ri+1)+'</div>'
      + '<div class="eyebrow" style="margin-top:18px">Ronde '+(s.ri+1)+' — '+esc(s.r.thema)+'</div>'
      + '<h2>'+esc(s.r.naam)+'</h2>'
      + '<div class="sub">'+esc(s.r.intro)+'</div>'
      + '<div class="tags"><div class="chip">'+s.r.vragen.length+' vragen</div>'
      + '<div class="chip">'+esc(s.r.thema)+'</div></div></div>';
    break;

  case 'q':
    html = '<div class="slide">' + qHead(s) + qBody(s) + qPeek(s) + '</div>';
    break;

  case 'swap':

let mediaTimer = null;
let currentPlayer = null;
let mediaSequenceTimer = null;
let lyricsRAF = null;
let lyricsDelayTimer = null;

/* songtekst automatisch laten meescrollen; stopt 10 seconden voor het einde
   van het fragment (blijft daarna gewoon staan, verdwijnt niet). */
const LYRICS_START_DELAY = 15;   /* start pas 15s na het begin van het fragment */
const LYRICS_END_MARGIN  = 10;   /* klaar met scrollen 10s voor het einde */
function startLyricsScroll(seconds){
  stopLyricsScroll();
  const scrollBox = document.getElementById('lyrics-scroll');
  const text = document.getElementById('lyrics-text');
  if(!scrollBox || !text) return;
  text.style.transform = 'translateY(0)';
  const maxScroll = Math.max(0, text.scrollHeight - scrollBox.clientHeight);
  if(maxScroll <= 0) return;
  const scrollWindow = Math.max(1, seconds - LYRICS_END_MARGIN - LYRICS_START_DELAY) * 1000;
  lyricsDelayTimer = setTimeout(() => {
    const t0 = performance.now();
    const step = (now) => {
      const frac = Math.min(1, (now - t0) / scrollWindow);
      text.style.transform = 'translateY(-' + (frac * maxScroll) + 'px)';
      if(frac < 1) lyricsRAF = requestAnimationFrame(step);
    };
    lyricsRAF = requestAnimationFrame(step);
  }, LYRICS_START_DELAY * 1000);
}
function stopLyricsScroll(){
  if(lyricsDelayTimer){ clearTimeout(lyricsDelayTimer); lyricsDelayTimer = null; }
  cancelAnimationFrame(lyricsRAF);
  lyricsRAF = null;
}
let beepTimers = [];
let beepCtx = null;
let beepEl = null;      /* voorbereid <audio>-element met de piep erin */
let beepUrls = {};      /* cache: duur -> blob-url */
let beepBufs = {};      /* cache: duur@samplerate -> AudioBuffer */

/* ---- piep bijstellen ---- */
const BEEP_FREQ = 450;  /* toonhoogte in Hz */
const BEEP_VOL  = 0.02;  /* volume 0..1 */
/* Alleen voor de reserveroute (Web Audio). Browsers rekenen <audio>.volume
   niet altijd even lineair door als een GainNode, dus als de piep via de
   reserveroute nog steeds harder of zachter klinkt: zet dit lager (bv. 0.5)
   of hoger (bv. 2). 1 = precies dezelfde rekensom als de hoofdroute. */
const BEEP_VOL_WEBAUDIO = 0.02;

/* Bouwt een klein WAV-bestandje (blokgolf) van 'sec' seconden in het geheugen.
   Waarom via een <audio>-element en niet rechtstreeks via de Web Audio API?
   Browsers geven geluid alleen vrij op het moment dat iemand klikt. De piep
   klinkt pas 20-40 s later, dus moeten we hem tijdens de klik al klaarzetten.
   Een <audio>-element laat zich zo "ontgrendelen"; op iPhone/iPad speelt dat
   ook nog eens door de belknop-op-stil heen. Web Audio staat als reserve. */
function beepSamples(sec, sr){
  const n = Math.max(1, Math.round(sec * sr)), amp = 0.5;
  const out = new Float32Array(n);
  const fade = Math.min(Math.round(sr*0.008), Math.floor(n/4));  /* 8 ms in/uit tegen geknetter */
  for(let i=0;i<n;i++){
    const s = ((i/sr) * BEEP_FREQ % 1) < 0.5 ? 1 : -1;
    let env = 1;
    if(fade > 0){
      if(i < fade) env = i/fade;
      else if(i > n-fade) env = Math.max(0, (n-i)/fade);
    }
    out[i] = s * env * amp;
  }
  return out;
}

function beepUrl(sec){
  const key = sec.toFixed(3);
  if(beepUrls[key]) return beepUrls[key];
  const sr = 44100, pcm = beepSamples(sec, sr), n = pcm.length;
  const buf = new ArrayBuffer(44 + n*2), v = new DataView(buf);
  const txt = (o,s)=>{ for(let i=0;i<s.length;i++) v.setUint8(o+i, s.charCodeAt(i)); };
  txt(0,'RIFF');  v.setUint32(4, 36 + n*2, true);  txt(8,'WAVE');
  txt(12,'fmt '); v.setUint32(16, 16, true);   v.setUint16(20, 1, true);
  v.setUint16(22, 1, true);      v.setUint32(24, sr, true);
  v.setUint32(28, sr*2, true);   v.setUint16(32, 2, true);  v.setUint16(34, 16, true);
  txt(36,'data'); v.setUint32(40, n*2, true);
  for(let i=0;i<n;i++) v.setInt16(44 + i*2, Math.round(pcm[i] * 32767), true);
  beepUrls[key] = URL.createObjectURL(new Blob([buf], {type:'audio/wav'}));
  return beepUrls[key];
}

/* Wordt aangeroepen tijdens de klik op "Speel fragment" -- het enige moment
   waarop de browser geluid vrijgeeft. Kort start-en-stop = ontgrendeld. */
function primeBeep(sec){
  if(!sec) return;
  try{
    if(beepEl){ try{ beepEl.pause(); }catch(e){} }
    beepEl = new Audio(beepUrl(sec));
    beepEl.preload = 'auto';
    beepEl.volume = BEEP_VOL;
    const el = beepEl;
    const arm = ()=>{ try{ el.pause(); el.currentTime = 0; }catch(e){} };
    const p = el.play();
    arm();                                   /* meteen weer stil */
    if(p && p.then) p.then(arm, ()=>{});     /* en nog eens zodra play() rond is */
  }catch(e){ beepEl = null; }
  try{                                       /* reserveroute ook nu openzetten */
    beepCtx = beepCtx || new (window.AudioContext||window.webkitAudioContext)();
    if(beepCtx.state === 'suspended') beepCtx.resume();
  }catch(e){ beepCtx = null; }
}

function clearBeep(){
  beepTimers.forEach(clearTimeout);
  beepTimers = [];
  const tag = document.getElementById('beeptag');
  if(tag) tag.classList.remove('on');
  if(beepEl){ try{ beepEl.pause(); beepEl.currentTime = 0; }catch(e){} }
}

/* Reserveroute: piep via de Web Audio API.
   Belangrijk: hier klinkt exact dezelfde golfvorm als in het WAV-bestandje
   hierboven (zelfde blokgolf, zelfde 8 ms fades, zelfde amplitude 0.5), en
   BEEP_VOL wordt net als bij <audio>.volume als losse factor toegepast.
   Anders klinkt de reserveroute veel harder en anders dan de hoofdroute. */
function beepViaWebAudio(sec){
  try{
    beepCtx = beepCtx || new (window.AudioContext||window.webkitAudioContext)();
    if(beepCtx.state === 'suspended') beepCtx.resume();
    const d = Math.max(0.05, sec);
    const key = d.toFixed(3) + '@' + beepCtx.sampleRate;
    let ab = beepBufs[key];
    if(!ab){
      const pcm = beepSamples(d, beepCtx.sampleRate);
      ab = beepCtx.createBuffer(1, pcm.length, beepCtx.sampleRate);
      ab.getChannelData(0).set(pcm);
      beepBufs[key] = ab;
    }
    const src = beepCtx.createBufferSource(), gain = beepCtx.createGain();
    src.buffer = ab;
    gain.gain.value = BEEP_VOL * BEEP_VOL_WEBAUDIO;
    src.connect(gain).connect(beepCtx.destination);
    src.start(beepCtx.currentTime);
  }catch(e){}
}

function playBeepTone(sec){
  if(beepEl){
    try{
      beepEl.currentTime = 0;
      beepEl.volume = BEEP_VOL;
      const p = beepEl.play();
      if(p && p.catch) p.catch(()=>beepViaWebAudio(sec));
      return;
    }catch(e){}
  }
  beepViaWebAudio(sec);
}

function destroyPlayer(){
  clearBeep();
  stopLyricsScroll();
  if(mediaSequenceTimer){ clearTimeout(mediaSequenceTimer); mediaSequenceTimer = null; }
  if(currentPlayer){
    try{ currentPlayer.pause(); currentPlayer.remove(); }catch(e){}
  }
  currentPlayer = null;
}
function muteCurrent(){ if(currentPlayer) currentPlayer.muted = true; }
function unmuteCurrent(){ if(currentPlayer) currentPlayer.muted = false; }
function scheduleBeep(beepStart, beepDur){
  if(beepStart==null || !beepDur) return;
  const tag = document.getElementById('beeptag');
  beepTimers.push(setTimeout(()=>{
    muteCurrent();
    if(tag) tag.classList.add('on');
    playBeepTone(beepDur);
  }, beepStart*1000));
  beepTimers.push(setTimeout(()=>{
    unmuteCurrent();
    if(tag) tag.classList.remove('on');
  }, (beepStart+beepDur)*1000));
}

function showMediaError(msg){
  clearInterval(mediaTimer);
  destroyPlayer();
  const box = document.getElementById('mb');
  if(box) box.querySelectorAll('audio,video').forEach(x=>x.remove());
  const err = document.getElementById('mediaerr');
  if(!err) return;
  err.innerHTML = '⚠ Dit fragment speelt niet af.<br>' + esc(msg);
  err.classList.add('on');
}

/* lokaal audio/video-bestand afspelen (geen internet nodig) */
window.playMedia = function(path, start, dur, isFilm, beepStart, beepDur, introFile, introStart, introDur){
  const box = document.getElementById('mb');
  if(!box) return;
  destroyPlayer();
  const errEl = document.getElementById('mediaerr'); if(errEl) errEl.classList.remove('on');
  box.querySelectorAll('audio,video').forEach(f=>f.remove());
  const el = document.createElement(isFilm ? 'video' : 'audio');
  if(isFilm) el.className = 'localvideo';
  el.preload = 'auto';
  const cover = document.getElementById('cover');
  if(isFilm){
    cover.remove();
  } else {
    const v = document.getElementById('vinyl'); if(v) v.classList.remove('paused');
  }
  let seekAt = start || 0;
  let currentTotal = Number(dur) || 20;
  if(introFile && introDur){ currentTotal += Number(introDur); }
  el.addEventListener('loadedmetadata', ()=>{ try{ el.currentTime = seekAt; }catch(e){} });
  el.addEventListener('error', ()=>showMediaError(
    'Bestand "'+path+'" kon niet geladen worden. Bestaat het pad, en staat het in de map naast dit HTML-bestand?'));
  box.appendChild(el);
  currentPlayer = el;
  const playPrimary = () => {
    seekAt = start || 0;
    el.src = path;
    el.play().catch(()=>showMediaError(
      'Kon "'+path+'" niet afspelen (browser blokkeerde het afspelen, of het bestand ontbreekt).'));
    startLyricsScroll(dur);
  };
  if(introFile && introDur){
    seekAt = introStart || 0;
    el.src = introFile;
    el.play().catch(()=>showMediaError(
      'Kon "'+introFile+'" niet afspelen (browser blokkeerde het afspelen, of het bestand ontbreekt).'));
    mediaSequenceTimer = setTimeout(() => {
      if(!currentPlayer || currentPlayer !== el) return;
      playPrimary();
    }, Number(introDur) * 1000);
  } else {
    playPrimary();
  }
  primeBeep(beepDur);   /* nu, tijdens de klik, de piep vrijgeven */
  scheduleBeep(beepStart, beepDur);
  let left = currentTotal;
  const d = document.getElementById('mtimer');
  clearInterval(mediaTimer);
  mediaTimer = setInterval(()=>{
    left--;
    if(d) d.textContent = left + ' seconden';
    if(left<=0){
      clearInterval(mediaTimer);
      destroyPlayer();
      box.querySelectorAll('audio,video').forEach(x=>x.remove());
      const vv = document.getElementById('vinyl'); if(vv) vv.classList.add('paused');
      if(d) d.textContent = 'fragment afgelopen — druk nogmaals voor herhaling';
      if(isFilm) box.insertAdjacentHTML('beforeend',
        '<div class="cover"><div><div class="playbtn" onclick="playMedia(\''+jsStr(path)+'\','+start+','+dur+',true,'+(beepStart==null?'null':beepStart)+','+(beepDur==null?'null':beepDur)+','+(introFile ? '\''+jsStr(introFile)+'\'' : 'null')+','+(introStart==null?0:introStart)+','+(introDur==null?0:introDur)+')">↻ Nog een keer</div></div></div>');
    }
  },1000);
};

function startQuizMusic(){

  if(QUIZMUZIEK.length > 1 && n === lastMusicIdx) n = (n + 1) % QUIZMUZIEK.length;
  lastMusicIdx = n;
  const el = new Audio(encodeURI(QUIZMUZIEK[n]));
  el.preload = 'auto';
  el.volume = 0.5;
  el.loop = true;
  quizMusic = el;
  el.play().catch(()=>{});
}

function stopQuizMusic(){
  if(quizMusic){
    try{ quizMusic.pause(); quizMusic.src = ''; }catch(e){}
    quizMusic = null;
  }
}

/* --- vraagtimer --- */
let timerTotal = 0;
function startTimer(sec){
  stopTimer(); timeLeft = sec; timerTotal = sec;
  startQuizMusic();
  if(ringEl){
    ringEl.classList.remove('time-up');
    ringEl.classList.add('on');
    ringFg.style.transition = 'none';
    ringFg.style.strokeDashoffset = '0';
    ringFg.getBoundingClientRect();
    ringFg.style.transition = '';
    ringNum.textContent = timeLeft;
  }
  timerId = setInterval(()=>{
    timeLeft--;
    if(ringEl){
      const frac = Math.max(0, timeLeft) / timerTotal;
      ringFg.style.strokeDashoffset = String(RING_CIRC * (1 - frac));
      ringNum.textContent = timeLeft>0 ? timeLeft : '0';
      ringEl.classList.toggle('time-up', timeLeft<=0);
    }
    if(timeLeft<=0) clearInterval(timerId);
  },1000);
}
function stopTimer(){
  if(timerId){clearInterval(timerId); timerId=null;}
  clearInterval(mediaTimer); destroyPlayer(); stopQuizMusic();
  if(ringEl) ringEl.classList.remove('on','time-up');
}

/* --- navigatie --- */
function go(n){ i = Math.max(0, Math.min(slides.length-1, n)); render(); }
document.addEventListener('keydown', e=>{
  const ov = document.getElementById('overview');
  if(e.key==='Escape'){ ov.classList.remove('on'); return; }
  if(ov.classList.contains('on')) return;
  switch(e.key){
    case 'ArrowRight': case ' ': case 'PageDown': case 'Enter': e.preventDefault(); go(i+1); break;
    case 'ArrowLeft':  case 'PageUp': e.preventDefault(); go(i-1); break;
    case 'Home': go(0); break;
    case 'End':  go(slides.length-1); break;
    case 'a': case 'A': {
      const p = document.getElementById('peek');
      if(p){ peek=!peek; p.classList.toggle('on', peek); }
      break;
    }
    case 't': case 'T': startTimer(20); toast('Timer 20 seconden'); break;
    case 'f': case 'F':
      if(!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
      break;
    case 'o': case 'O': openOverview(); break;
  }
});
stage.addEventListener('click', e=>{
  if(e.target.closest('iframe,.playbtn,a')) return;
  go(i+1);
});

function openOverview(){
  const g = document.getElementById('ovgrid');
  g.innerHTML = slides.map((s,n)=>{
    let t = '', sub = '';
    if(s.kind==='title'){t='Titel';}
    else if(s.kind==='rules'){t='Spelregels';}
    else if(s.kind==='round'){t='Ronde '+(s.ri+1); sub=s.r.naam;}
    else if(s.kind==='q'){t=roundLetter(s.ri)+' · vraag '+(s.qi+1); sub=s.q.v.slice(0,46)+'…';}
    else if(s.kind==='swap'){t='Bladen wisselen';}
    else if(s.kind==='sheet'){t='Nakijksheet R'+s.ri+'/'+(s.ri+1);}
    else if(s.kind==='final'){t='Eindstand';}
    else {t='Slot';}
    return '<button onclick="jump('+n+')">'+esc(t)+'<small>'+esc(sub)+'</small></button>';
  }).join('');
  document.getElementById('overview').classList.add('on');
}
window.jump = function(n){ document.getElementById('overview').classList.remove('on'); go(n); };

/* klok */
setInterval(()=>{
  const d = new Date();
  document.getElementById('clock').textContent =
    String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
},1000);

render();
console.log('Slides:', slides.length);
</script>
